<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riviz AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #263b73 0%, transparent 35%),
        radial-gradient(circle at bottom right, #4b1f68 0%, transparent 35%),
        #080b14;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(8,11,20,0.75);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c5cff, #00d4ff);
      box-shadow: 0 0 25px rgba(0,212,255,0.25);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select,
    button {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.07);
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    select option {
      background: #111522;
      color: white;
    }

    button:hover,
    select:hover {
      background: rgba(255,255,255,0.12);
    }

    main {
      width: 100%;
      max-width: 950px;
      margin: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 25px 18px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px 5px 130px;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome h1 {
      font-size: clamp(38px, 8vw, 70px);
      background: linear-gradient(90deg, #ffffff, #9edcff, #b99cff);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #aeb6ca;
      font-size: 17px;
      max-width: 600px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      padding: 12px 15px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      color: #dce2f0;
    }

    .suggestion:hover {
      background: rgba(124,92,255,0.18);
    }

    .message {
      display: flex;
      margin: 18px 0;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: normal;
    }

    .user .bubble {
      background: linear-gradient(135deg, #6651db, #5140b7);
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 5px;
      color: #edf1fa;
    }

    /* Markdown formatting */
    .bubble strong {
      font-weight: 700;
      color: #ffffff;
    }

    .bubble em {
      font-style: italic;
    }

    .bubble code {
      background: rgba(0,0,0,0.35);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
    }

    .bubble pre {
      background: #05070d;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
    }

    .bubble ul,
    .bubble ol {
      padding-left: 24px;
      margin: 8px 0;
    }

    .bubble li {
      margin: 4px 0;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #aeb6ca;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-5px);
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px 18px 20px;
      background: linear-gradient(
        transparent,
        rgba(8,11,20,0.96) 30%
      );
      z-index: 5;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20,24,38,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 17px;
      padding: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 12px;
    }

    #messageInput::placeholder {
      color: #7f879b;
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: linear-gradient(135deg, #735cff, #00bfff);
      border: none;
      font-size: 18px;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #737c92;
      font-size: 12px;
      margin-top: 7px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 18px;
      }

      .logo-icon {
        width: 34px;
        height: 34px;
      }

      .controls button {
        display: none;
      }

      select {
        padding: 8px;
      }

      main {
        padding: 10px 10px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome h1 {
        font-size: 46px;
      }

      .suggestions {
        padding: 0 5px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      Riviz AI
    </div>

    <div class="controls">
      <select id="mode">
        <option value="auto">AUTO</option>
        <option value="online">ONLINE</option>
        <option value="offline">OFFLINE</option>
      </select>

      <button onclick="clearChat()">Clear</button>
    </div>
  </header>

  <main>
    <div id="chat">

      <div class="welcome" id="welcome">
        <h1>Riviz AI</h1>
        <p>Your smart AI assistant. Ask anything and let Riviz help you.</p>

        <div class="suggestions">
          <div class="suggestion" onclick="useSuggestion('Explain photosynthesis simply')">
            🌱 Explain photosynthesis
          </div>

          <div class="suggestion" onclick="useSuggestion('Tell me a funny joke')">
            😂 Tell me a joke
          </div>

          <div class="suggestion" onclick="useSuggestion('Give me a cool science fact')">
            🔬 Science fact
          </div>

          <div class="suggestion" onclick="useSuggestion('What is artificial intelligence?')">
            🤖 What is AI?
          </div>
        </div>
      </div>

    </div>
  </main>

  <div class="input-area">
    <div class="input-box">
      <input
        id="messageInput"
        type="text"
        placeholder="Message Riviz AI..."
        autocomplete="off"
      />

      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="status" id="status">
      AUTO mode
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const modeSelect = document.getElementById("mode");
    const welcome = document.getElementById("welcome");

    let conversation = [];

    /*
      Converts Gemini Markdown into safe HTML.

      Most importantly:
      **text** -> <strong>text</strong>

      This fixes the problem where Riviz was showing:
      **4**

      instead of:
      4 in bold.
    */
    function renderMarkdown(text) {
      if (!text) return "";

      // Escape HTML first for safety
      let html = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks
      html = html.replace(
        /```([\s\S]*?)```/g,
        '<pre><code>$1</code></pre>'
      );

      // Inline code
      html = html.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );

      // Bold
      html = html.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      // Italic
      html = html.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
      );

      // Headings
      html = html.replace(
        /^### (.*)$/gm,
        "<strong>$1</strong>"
      );

      html = html.replace(
        /^## (.*)$/gm,
        "<strong>$1</strong>"
      );

      html = html.replace(
        /^# (.*)$/gm,
        "<strong>$1</strong>"
      );

      // Unordered lists
      html = html.replace(
        /(?:^|\n)[-*] (.*)(?=\n|$)/g,
        "<li>$1</li>"
      );

      html = html.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
      );

      // Numbered lists
      html = html.replace(
        /(?:^|\n)\d+\. (.*)(?=\n|$)/g,
        "<li>$1</li>"
      );

      // Line breaks
      html = html.replace(/\n/g, "<br>");

      return html;
    }

    function addMessage(text, type) {
      if (welcome) {
        welcome.style.display = "none";
      }

      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (type === "assistant") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        // User messages stay plain text
        bubble.textContent = text;
      }

      message.appendChild(bubble);
      chat.appendChild(message);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return message;
    }

    function showTyping() {
      const message = document.createElement("div");
      message.className = "message assistant";
      message.id = "typingMessage";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      message.appendChild(bubble);
      chat.appendChild(message);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    function removeTyping() {
      const typing = document.getElementById("typingMessage");

      if (typing) {
        typing.remove();
      }
    }

    async function sendMessage() {
      const userMessage = input.value.trim();

      if (!userMessage) return;

      input.value = "";
      sendBtn.disabled = true;

      addMessage(userMessage, "user");

      conversation.push({
        role: "user",
        content: userMessage
      });

      showTyping();

      statusText.textContent = "Riviz is thinking...";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: userMessage
          })
        });

        const data = await response.json();

        removeTyping();

        if (!response.ok) {
          throw new Error(data.error || "AI request failed");
        }

        const answer =
          data.answer ||
          "Sorry, I couldn't generate a response.";

        addMessage(answer, "assistant");

        conversation.push({
          role: "assistant",
          content: answer
        });

        statusText.textContent =
          modeSelect.value.toUpperCase() + " mode";

      } catch (error) {
        removeTyping();

        console.error(error);

        addMessage(
          "⚠️ Sorry, I couldn't connect to the AI server.",
          "assistant"
        );

        statusText.textContent = "Connection error";

      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function useSuggestion(text) {
      input.value = text;
      input.focus();
      sendMessage();
    }

    function clearChat() {
      conversation = [];

      chat.innerHTML = `
        <div class="welcome" id="welcome">
          <h1>Riviz AI</h1>
          <p>Your smart AI assistant. Ask anything and let Riviz help you.</p>

          <div class="suggestions">
            <div class="suggestion" onclick="useSuggestion('Explain photosynthesis simply')">
              🌱 Explain photosynthesis
            </div>

            <div class="suggestion" onclick="useSuggestion('Tell me a funny joke')">
              😂 Tell me a joke
            </div>

            <div class="suggestion" onclick="useSuggestion('Give me a cool science fact')">
              🔬 Science fact
            </div>

            <div class="suggestion" onclick="useSuggestion('What is artificial intelligence?')">
              🤖 What is AI?
            </div>
          </div>
        </div>
      `;

      statusText.textContent =
        modeSelect.value.toUpperCase() + " mode";
    }

    modeSelect.addEventListener("change", () => {
      statusText.textContent =
        modeSelect.value.toUpperCase() + " mode";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
