<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riviz AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(circle at top left, #1c2860 0, transparent 35%),
    radial-gradient(circle at bottom right, #35175c 0, transparent 35%),
    #070a13;
  color: #fff;
}

.app {
  width: 100%;
  max-width: 1100px;
  height: 100vh;
  margin: auto;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  height: 72px;
  padding: 0 25px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(10,13,25,.75);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#667cff,#9b5cff);
  box-shadow: 0 8px 30px rgba(102,124,255,.35);
  font-size: 21px;
}

.brand h2 {
  font-size: 19px;
}

.brand span {
  color: #8992aa;
  font-size: 12px;
}

.mode {
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.05);
  color: #fff;
  padding: 10px 14px;
  border-radius: 12px;
  outline: none;
}

/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 35px 20px 120px;
}

.welcome {
  max-width: 700px;
  margin: 12vh auto 0;
  text-align: center;
}

.welcome .big-logo {
  width: 75px;
  height: 75px;
  margin: auto auto 20px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  font-size: 34px;
  background: linear-gradient(135deg,#667cff,#a855f7);
  box-shadow: 0 15px 60px rgba(100,100,255,.3);
}

.welcome h1 {
  font-size: clamp(36px,7vw,58px);
  margin-bottom: 12px;
  background: linear-gradient(90deg,#fff,#aebaff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.welcome p {
  color: #929bb2;
  font-size: 16px;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 12px;
  margin-top: 35px;
}

.suggestion {
  padding: 17px;
  text-align: left;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 15px;
  background: rgba(255,255,255,.035);
  color: #dce1ef;
  cursor: pointer;
  transition: .2s;
}

.suggestion:hover {
  background: rgba(255,255,255,.08);
  transform: translateY(-2px);
}

/* MESSAGES */
.message {
  display: flex;
  margin: 18px auto;
  max-width: 820px;
}

.bubble {
  max-width: 75%;
  padding: 14px 17px;
  border-radius: 18px;
  line-height: 1.55;
  white-space: pre-wrap;
}

.user {
  justify-content: flex-end;
}

.user .bubble {
  background: linear-gradient(135deg,#536dfe,#7357e8);
  border-bottom-right-radius: 5px;
}

.ai .bubble {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.07);
  border-bottom-left-radius: 5px;
}

/* INPUT */
.input-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 18px 20px 22px;
  background: linear-gradient(transparent,#070a13 35%);
}

.input-box {
  max-width: 820px;
  margin: auto;
  display: flex;
  gap: 10px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(18,22,38,.9);
  backdrop-filter: blur(20px);
  border-radius: 18px;
  box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  background: transparent;
  border: 0;
  outline: none;
  color: white;
  font-size: 15px;
}

input::placeholder {
  color: #70798f;
}

.send {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg,#6178ff,#895cff);
  color: white;
  font-size: 20px;
  cursor: pointer;
  transition: .2s;
}

.send:hover {
  transform: scale(1.05);
}

.clear {
  position: fixed;
  top: 85px;
  right: 20px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.04);
  color: #8992aa;
  cursor: pointer;
}

/* MOBILE */
@media(max-width:600px) {
  header {
    padding: 0 15px;
  }

  .brand span {
    display: none;
  }

  #chat {
    padding-left: 12px;
    padding-right: 12px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .bubble {
    max-width: 88%;
  }

  .clear {
    display: none;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <h2>Riviz AI</h2>
      <span>Your intelligent AI assistant</span>
    </div>
  </div>

  <select class="mode" id="mode">
    <option>AUTO</option>
    <option>ONLINE</option>
    <option>OFFLINE</option>
  </select>
</header>

<button class="clear" onclick="clearChat()">Clear</button>

<div id="chat">

  <div class="welcome" id="welcome">
    <div class="big-logo">✦</div>

    <h1>How can I help?</h1>

    <p>Ask anything. Riviz is ready.</p>

    <div class="suggestions">
      <div class="suggestion" onclick="usePrompt('Explain quantum physics simply')">
        🧠 Explain something
      </div>

      <div class="suggestion" onclick="usePrompt('Give me a cool science project idea')">
        🔬 Get an idea
      </div>

      <div class="suggestion" onclick="usePrompt('Write a short story about AI')">
        ✍️ Write something
      </div>

      <div class="suggestion" onclick="usePrompt('Help me learn coding')">
        💻 Learn coding
      </div>
    </div>
  </div>

</div>

<div class="input-wrap">
  <div class="input-box">
    <input
      id="input"
      placeholder="Message Riviz AI..."
      autocomplete="off"
    >
    <button class="send" onclick="sendMessage()">➤</button>
  </div>
</div>

</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function addMessage(text, type) {
  welcome.style.display = "none";

  const row = document.createElement("div");
  row.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  chat.appendChild(row);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  setTimeout(() => {
    addMessage(
      "I'm Riviz AI 🤖\n\nThe real AI engine is coming next!",
      "ai"
    );
  }, 700);
}

function usePrompt(text) {
  input.value = text;
  input.focus();
}

function clearChat() {
  location.reload();
}

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
</script>

</body>
</html>
