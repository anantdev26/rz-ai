<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riviz AI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#0b1020;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center
    }
    .app{
      width:95%;
      max-width:900px;
      height:90vh;
      background:#12182b;
      border:1px solid #293352;
      border-radius:20px;
      display:flex;
      flex-direction:column;
      overflow:hidden
    }
    header{
      padding:18px 22px;
      border-bottom:1px solid #293352;
      display:flex;
      justify-content:space-between
    }
    .logo{font-size:24px;font-weight:bold}
    .status{
      background:#193d2b;
      color:#6fffa1;
      padding:7px 12px;
      border-radius:20px;
      font-size:13px
    }
    #chat{flex:1;overflow-y:auto;padding:25px}
    .welcome{text-align:center;margin-top:20%}
    .welcome h1{font-size:40px;margin-bottom:10px}
    .welcome p{color:#9da7c2}
    .message{
      max-width:80%;
      padding:12px 16px;
      margin:12px 0;
      border-radius:15px;
      line-height:1.5;
      white-space:pre-wrap
    }
    .user{background:#3157d5;margin-left:auto}
    .ai{background:#202943;margin-right:auto}
    .input-area{
      padding:15px;
      border-top:1px solid #293352;
      display:flex;
      gap:10px
    }
    input{
      flex:1;
      padding:14px;
      border-radius:12px;
      border:1px solid #344064;
      outline:none;
      background:#0d1324;
      color:white;
      font-size:16px
    }
    button{
      border:0;
      border-radius:12px;
      padding:0 20px;
      background:#4169e1;
      color:white;
      font-weight:bold;
      cursor:pointer
    }
    @media(max-width:600px){
      .app{width:100%;height:100vh;border-radius:0}
      .message{max-width:90%}
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">✨ Riviz AI</div>
    <div class="status">● Ready</div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>Riviz AI</h1>
      <p>Your AI assistant is ready.</p>
    </div>
  </div>

  <div class="input-area">
    <input id="input" type="text" placeholder="Ask Riviz anything...">
    <button onclick="sendMessage()">Send</button>
  </div>

</div>

<script>
const input=document.getElementById("input");
const chat=document.getElementById("chat");
const welcome=document.getElementById("welcome");

function addMessage(text,type){
  welcome.style.display="none";

  const msg=document.createElement("div");
  msg.className="message "+type;
  msg.textContent=text;

  chat.appendChild(msg);
  chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";

  setTimeout(()=>{
    addMessage(
      "Riviz AI is connecting to its AI brain 🤖\n\nOnline + Offline AI will be added next!",
      "ai"
    );
  },600);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});
</script>

</body>
</html>
