<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riviz AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #263b73 0%, transparent 35%),
        radial-gradient(circle at bottom right, #4b1f68 0%, transparent 35%),
        #080b14;
      color: white;
      min-height: 100vh;
    }

    header {
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(8,11,20,0.8);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c5cff, #00d4ff);
      box-shadow: 0 0 25px rgba(0,212,255,0.25);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select,
    button {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.07);
      color: white;
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
    }

    select option {
      background: #111522;
      color: white;
    }

    button:hover,
    select:hover {
      background: rgba(255,255,255,0.12);
    }

    main {
      width: 100%;
      max-width: 950px;
      margin: auto;
      min-height: calc(100vh - 70px);
      padding: 25px 18px;
    }

    #chat {
      padding: 15px 5px 130px;
    }

    .welcome {
      min-height: 65vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome h1 {
      font-size: clamp(38px, 8vw, 70px);
      background: linear-gradient(90deg, #fff, #9edcff, #b99cff);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #aeb6ca;
      font-size: 17px;
      max-width: 600px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      padding: 12px 15px;
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      color: #dce2f0;
    }

    .suggestion:hover {
      background: rgba(124,92,255,0.18);
    }

    .message {
      display: flex;
      margin: 18px 0;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.55;
      word-wrap: break-word;
    }

    .user .bubble {
      background: linear-gradient(135deg, #6651db, #5140b7);
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom-left-radius: 5px;
      color: #edf1fa;
    }

    .bubble strong {
      color: white;
    }

    .bubble code {
      background: rgba(0,0,0,0.35);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
    }

    .bubble pre {
      background: #05070d;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
    }

    .bubble ul,
    .bubble ol {
      padding-left: 24px;
      margin: 8px 0;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 5px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #aeb6ca;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-5px);
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px 18px 20px;
      background: linear-gradient(
        transparent,
        rgba(8,11,20,0.96) 30%
      );
      z-index: 5;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20,24,38,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 17px;
      padding: 8px;
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 16px;
      padding: 12px;
    }

    #messageInput::placeholder {
      color: #7f879b;
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: linear-gradient(135deg, #735cff, #00bfff);
      border: none;
      font-size: 18px;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: #737c92;
      font-size: 12px;
      margin-top: 7px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 18px;
      }

      .controls button {
        display: none;
      }

      select {
        padding: 8px;
      }

      main {
        padding: 10px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome h1 {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    Riviz AI
  </div>

  <div class="controls">
    <select id="mode">
      <option value="auto">AUTO</option>
      <option value="online">ONLINE</option>
      <option value="offline">OFFLINE</option>
    </select>

    <button onclick="clearChat()">Clear</button>
  </div>
</header>

<main>
  <div id="chat">

    <div class="welcome" id="welcome">
      <h1>Riviz AI</h1>

      <p>
        Your smart AI assistant. Online, offline, or automatic.
      </p>

      <div class="suggestions">

        <div class="suggestion"
          onclick="useSuggestion('Explain photosynthesis simply')">
          🌱 Explain photosynthesis
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Tell me a funny joke')">
          😂 Tell me a joke
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Give me a cool science fact')">
          🔬 Science fact
        </div>

        <div class="suggestion"
          onclick="useSuggestion('What is artificial intelligence?')">
          🤖 What is AI?
        </div>

      </div>
    </div>

  </div>
</main>

<div class="input-area">

  <div class="input-box">

    <input
      id="messageInput"
      type="text"
      placeholder="Message Riviz AI..."
      autocomplete="off"
    />

    <button id="sendBtn" onclick="sendMessage()">➤</button>

  </div>

  <div class="status" id="status">
    AUTO mode
  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const statusText = document.getElementById("status");
const modeSelect = document.getElementById("mode");

let conversation = [];


/* =========================
   MARKDOWN
========================= */

function renderMarkdown(text) {

  if (!text) return "";

  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  html = html.replace(
    /```([\s\S]*?)```/g,
    "<pre><code>$1</code></pre>"
  );

  html = html.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  html = html.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
    "<em>$1</em>"
  );

  html = html.replace(
    /^### (.*)$/gm,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /^## (.*)$/gm,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /^# (.*)$/gm,
    "<strong>$1</strong>"
  );

  html = html.replace(
    /(?:^|\n)[-*] (.*)(?=\n|$)/g,
    "<li>$1</li>"
  );

  html = html.replace(
    /(<li>.*<\/li>)/gs,
    "<ul>$1</ul>"
  );

  html = html.replace(/\n/g, "<br>");

  return html;
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

  const welcome = document.getElementById("welcome");

  if (welcome) {
    welcome.style.display = "none";
  }

  const message = document.createElement("div");

  message.className = "message " + type;

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  if (type === "assistant") {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }

  message.appendChild(bubble);

  chat.appendChild(message);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });
}


/* =========================
   TYPING
========================= */

function showTyping() {

  const message = document.createElement("div");

  message.className = "message assistant";

  message.id = "typingMessage";

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  message.appendChild(bubble);

  chat.appendChild(message);
}


function removeTyping() {

  const typing =
    document.getElementById("typingMessage");

  if (typing) {
    typing.remove();
  }
}


/* =========================
   OFFLINE AI
========================= */

function offlineAI(message) {

  const text = message.toLowerCase().trim();


  /* Greetings */

  if (
    text === "hi" ||
    text === "hello" ||
    text === "hey" ||
    text.includes("good morning") ||
    text.includes("good evening")
  ) {

    return "👋 Hello! I'm Riviz AI's offline mode. I can still help with simple questions, calculations and some basic knowledge.";
  }


  /* Who are you */

  if (
    text.includes("who are you") ||
    text.includes("what are you")
  ) {

    return "🤖 I'm Riviz AI. You are currently using my offline browser mode.";
  }


  /* Name */

  if (
    text.includes("your name")
  ) {

    return "My name is Riviz AI. ✦";
  }


  /* Addition */

  let match = text.match(
    /^(-?\d+(?:\.\d+)?)\s*\+\s*(-?\d+(?:\.\d+)?)$/
  );

  if (match) {

    const a = Number(match[1]);
    const b = Number(match[2]);

    return `**${a + b}**`;
  }


  /* Subtraction */

  match = text.match(
    /^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/
  );

  if (match) {

    const a = Number(match[1]);
    const b = Number(match[2]);

    return `**${a - b}**`;
  }


  /* Multiplication */

  match = text.match(
    /^(-?\d+(?:\.\d+)?)\s*(?:\*|x|×)\s*(-?\d+(?:\.\d+)?)$/
  );

  if (match) {

    const a = Number(match[1]);
    const b = Number(match[2]);

    return `**${a * b}**`;
  }


  /* Division */

  match = text.match(
    /^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/
  );

  if (match) {

    const a = Number(match[1]);
    const b = Number(match[2]);

    if (b === 0) {
      return "❌ You cannot divide by zero.";
    }

    return `**${a / b}**`;
  }


  /* Percentage */

  match = text.match(
    /^(-?\d+(?:\.\d+)?)\s*%\s*of\s*(-?\d+(?:\.\d+)?)$/
  );

  if (match) {

    const percent = Number(match[1]);
    const number = Number(match[2]);

    return `**${(percent / 100) * number}**`;
  }


  /* Simple science */

  if (text.includes("photosynthesis")) {

    return "🌱 Photosynthesis is the process plants use to make food using sunlight, water and carbon dioxide.";
  }


  if (
    text.includes("what is ai") ||
    text.includes("artificial intelligence")
  ) {

    return "🤖 Artificial intelligence (AI) is technology that allows computers to perform tasks that normally need human intelligence.";
  }


  if (text.includes("gravity")) {

    return "🌍 Gravity is a force that pulls objects toward each other. Earth's gravity keeps us on the ground.";
  }


  if (text.includes("water")) {

    return "💧 Water is made of hydrogen and oxygen. Its chemical formula is H₂O.";
  }


  if (text.includes("sun")) {

    return "☀️ The Sun is a star at the center of our solar system.";
  }


  if (text.includes("capital of india")) {

    return "🇮🇳 The capital of India is New Delhi.";
  }


  /* Offline fallback */

  return "📴 I'm currently in offline mode. I can answer basic questions and calculations, but I need the internet and Gemini AI for more advanced questions.";
}


/* =========================
   ONLINE AI
========================= */

async function onlineAI(message) {

  const response = await fetch("/api/chat", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      message: message
    })

  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error || "AI request failed"
    );
  }

  if (
    !data.answer ||
    typeof data.answer !== "string"
  ) {
    throw new Error("Empty AI response");
  }

  return data.answer;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const userMessage = input.value.trim();

  if (!userMessage) return;

  const selectedMode = modeSelect.value;

  input.value = "";

  sendBtn.disabled = true;

  addMessage(userMessage, "user");

  conversation.push({
    role: "user",
    content: userMessage
  });

  showTyping();

  statusText.textContent =
    selectedMode.toUpperCase() + " • Thinking...";


  try {

    let answer = "";


    /* =====================
       OFFLINE
    ===================== */

    if (selectedMode === "offline") {

      statusText.textContent =
        "OFFLINE • Browser AI";

      await new Promise(
        resolve => setTimeout(resolve, 300)
      );

      answer = offlineAI(userMessage);
    }


    /* =====================
       ONLINE
    ===================== */

    else if (selectedMode === "online") {

      statusText.textContent =
        "ONLINE • Gemini AI";

      answer = await onlineAI(userMessage);
    }


    /* =====================
       AUTO
    ===================== */

    else {

      if (navigator.onLine) {

        try {

          statusText.textContent =
            "AUTO • Trying online AI...";

          answer = await onlineAI(userMessage);

          statusText.textContent =
            "AUTO • Online AI";

        } catch (error) {

          console.log(
            "Online AI failed. Using offline mode.",
            error
          );

          statusText.textContent =
            "AUTO • Switching offline...";

          await new Promise(
            resolve => setTimeout(resolve, 300)
          );

          answer = offlineAI(userMessage);

          statusText.textContent =
            "AUTO • Offline fallback";
        }

      } else {

        statusText.textContent =
          "AUTO • Offline";

        answer = offlineAI(userMessage);
      }
    }


    removeTyping();

    addMessage(answer, "assistant");

    conversation.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {

    removeTyping();

    console.error(error);


    if (selectedMode === "online") {

      addMessage(
        "⚠️ Online AI is currently unavailable. Try AUTO mode or OFFLINE mode.",
        "assistant"
      );

      statusText.textContent =
        "ONLINE • Error";

    } else {

      addMessage(
        "⚠️ Something went wrong.",
        "assistant"
      );

      statusText.textContent =
        "Error";
    }

  } finally {

    sendBtn.disabled = false;

    input.focus();
  }
}


/* =========================
   SUGGESTIONS
========================= */

function useSuggestion(text) {

  input.value = text;

  input.focus();

  sendMessage();
}


/* =========================
   CLEAR CHAT
========================= */

function clearChat() {

  conversation = [];

  chat.innerHTML = `

    <div class="welcome" id="welcome">

      <h1>Riviz AI</h1>

      <p>
        Your smart AI assistant. Online, offline, or automatic.
      </p>

      <div class="suggestions">

        <div class="suggestion"
          onclick="useSuggestion('Explain photosynthesis simply')">
          🌱 Explain photosynthesis
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Tell me a funny joke')">
          😂 Tell me a joke
        </div>

        <div class="suggestion"
          onclick="useSuggestion('Give me a cool science fact')">
          🔬 Science fact
        </div>

        <div class="suggestion"
          onclick="useSuggestion('What is artificial intelligence?')">
          🤖 What is AI?
        </div>

      </div>

    </div>

  `;

  statusText.textContent =
    modeSelect.value.toUpperCase() + " mode";
}


/* =========================
   MODE SWITCH
========================= */

modeSelect.addEventListener(
  "change",
  () => {

    const mode = modeSelect.value;

    if (mode === "online") {

      statusText.textContent =
        "ONLINE • Gemini AI";

    }

    else if (mode === "offline") {

      statusText.textContent =
        "OFFLINE • Browser AI";

    }

    else {

      statusText.textContent =
        "AUTO • Online + Offline fallback";
    }

  }
);


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }

  }
);


/* =========================
   INTERNET STATUS
========================= */

window.addEventListener(
  "online",
  () => {

    if (modeSelect.value === "auto") {

      statusText.textContent =
        "AUTO • Internet connected";
    }

  }
);


window.addEventListener(
  "offline",
  () => {

    if (modeSelect.value === "auto") {

      statusText.textContent =
        "AUTO • Offline";
    }

  }
);

</script>

</body>
</html>
