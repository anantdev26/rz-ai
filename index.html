<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riviz AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #202a4a 0%, #0b0d14 45%, #05060a 100%);
      color: white;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid #252936;
      background: rgba(8, 10, 18, 0.8);
      backdrop-filter: blur(15px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6c63ff, #00d4ff);
      font-size: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select,
    button {
      border: 1px solid #303544;
      background: #151925;
      color: white;
      border-radius: 10px;
      padding: 9px 13px;
      cursor: pointer;
    }

    select:hover,
    button:hover {
      background: #202536;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 15px 120px;
    }

    .welcome {
      max-width: 750px;
      margin: 70px auto 30px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ffffff, #8fdcff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #a9afc1;
      font-size: 17px;
    }

    .suggestions {
      max-width: 750px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .suggestion {
      padding: 17px;
      text-align: left;
      border: 1px solid #292e3c;
      background: rgba(20, 23, 34, 0.8);
      border-radius: 15px;
      color: #dce1ef;
    }

    .suggestion:hover {
      border-color: #5964ff;
      transform: translateY(-2px);
    }

    .message {
      max-width: 850px;
      margin: 15px auto;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #5d62ff, #7258ff);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #171b27;
      border: 1px solid #292e3b;
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #aab2c8;
      animation: bounce 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: .4;
      }
      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 15px;
      background: linear-gradient(transparent, #080a10 35%);
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid #303545;
      background: #11141e;
      border-radius: 17px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 11px;
      min-height: 45px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: #747b8e;
    }

    #send {
      width: 48px;
      height: 48px;
      padding: 0;
      font-size: 20px;
      background: linear-gradient(135deg, #625cff, #00aeea);
      border: none;
    }

    .status {
      max-width: 850px;
      margin: 5px auto;
      text-align: center;
      color: #727a90;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 12px;
      }

      .logo {
        font-size: 18px;
      }

      .controls {
        gap: 5px;
      }

      .controls select,
      .controls button {
        padding: 7px 8px;
        font-size: 12px;
      }

      .welcome {
        margin-top: 40px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .bubble {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">
      <div class="logo-icon">✦</div>
      Riviz AI
    </div>

    <div class="controls">
      <select id="mode">
        <option value="auto">AUTO</option>
        <option value="online">ONLINE</option>
        <option value="offline">OFFLINE</option>
      </select>

      <button onclick="clearChat()">Clear</button>
    </div>
  </header>

  <main class="chat" id="chat">

    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Your intelligent AI assistant</p>

      <div class="suggestions">
        <button class="suggestion"
          onclick="useSuggestion('Explain photosynthesis in simple words')">
          🌱 Explain photosynthesis
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Give me 5 interesting science facts')">
          🔬 Science facts
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Help me write a Python program')">
          💻 Help with coding
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Give me a creative project idea')">
          💡 Project ideas
        </button>
      </div>
    </div>

  </main>

  <div class="input-area">
    <div class="status" id="status">Riviz AI is ready</div>

    <div class="input-box">
      <textarea
        id="message"
        placeholder="Message Riviz AI..."
        rows="1"
      ></textarea>

      <button id="send" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const statusText = document.getElementById("status");

let messages = [];

function addMessage(type, text) {

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {

  const message = document.createElement("div");
  message.className = "message ai";
  message.id = "typing";

  message.innerHTML = `
    <div class="bubble">
      <div class="typing">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {

  const typing = document.getElementById("typing");

  if (typing) {
    typing.remove();
  }
}

async function sendMessage() {

  const userMessage = input.value.trim();

  if (!userMessage) return;

  document.getElementById("welcome")?.remove();

  addMessage("user", userMessage);

  messages.push({
    role: "user",
    content: userMessage
  });

  input.value = "";

  sendButton.disabled = true;
  statusText.textContent = "Riviz AI is thinking...";

  showTyping();

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: userMessage
      })

    });

    const data = await response.json();

    removeTyping();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    const answer = data.answer || "I couldn't generate a response.";

    addMessage("ai", answer);

    messages.push({
      role: "assistant",
      content: answer
    });

    statusText.textContent = "Riviz AI is ready";

  } catch (error) {

    removeTyping();

    addMessage(
      "ai",
      "⚠️ Sorry, I couldn't connect to the AI server."
    );

    statusText.textContent = "Connection error";

    console.error(error);

  } finally {

    sendButton.disabled = false;
    input.focus();

  }
}

function useSuggestion(text) {

  input.value = text;
  input.focus();

}

function clearChat() {

  messages = [];

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>How can I help you?</h1>
      <p>Your intelligent AI assistant</p>

      <div class="suggestions">

        <button class="suggestion"
          onclick="useSuggestion('Explain photosynthesis in simple words')">
          🌱 Explain photosynthesis
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Give me 5 interesting science facts')">
          🔬 Science facts
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Help me write a Python program')">
          💻 Help with coding
        </button>

        <button class="suggestion"
          onclick="useSuggestion('Give me a creative project idea')">
          💡 Project ideas
        </button>

      </div>
    </div>
  `;

  statusText.textContent = "Riviz AI is ready";

}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();

  }

});

</script>

</body>
</html>
